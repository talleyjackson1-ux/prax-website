<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ── -->
    <title>APA Digital Marketing Group | Performance-Based Marketing for Small Businesses</title>
    <meta name="description" content="APA Digital Marketing Group runs social media, paid ads, lead generation, and websites for small businesses nationwide — on a performance-aligned model. We only get paid when you grow. Founded in Lee's Summit, Missouri." />
    <meta name="keywords" content="digital marketing agency, performance marketing, lead generation, paid ads management, social media management, small business marketing, Lee's Summit marketing, Kansas City digital marketing" />
    <meta name="author" content="APA Digital Marketing Group" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.apadigitalmarketing.com/" />
    <link rel="icon" type="image/png" href="/img/apa/apa-mark.png" />
    <meta name="theme-color" content="#0d161e" />

    <!-- ── Open Graph (Facebook, LinkedIn, iMessage) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="APA Digital Marketing Group" />
    <meta property="og:title" content="APA Digital Marketing Group — We only get paid when you do." />
    <meta property="og:description" content="Social media, paid ads, lead generation, and websites for small businesses nationwide — on a performance-aligned model. When you win, we win." />
    <meta property="og:url" content="https://www.apadigitalmarketing.com/" />
    <meta property="og:image" content="https://www.apadigitalmarketing.com/img/apa/apa-mark.png" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter / X ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="APA Digital Marketing Group — We only get paid when you do." />
    <meta name="twitter:description" content="Performance-aligned marketing for small businesses nationwide. Social, paid ads, lead gen, and websites." />
    <meta name="twitter:image" content="https://www.apadigitalmarketing.com/img/apa/apa-mark.png" />

    <!-- ── Structured data: LocalBusiness / ProfessionalService ── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "APA Digital Marketing Group",
        "description": "Performance-based digital marketing agency offering social media management, paid advertising, lead generation, customer acquisition, and website services for small businesses nationwide.",
        "url": "https://www.apadigitalmarketing.com/",
        "email": "ParkerK@apadigitalmarketing.com",
        "logo": "https://www.apadigitalmarketing.com/img/apa/apa-mark.png",
        "image": "https://www.apadigitalmarketing.com/img/apa/apa-mark.png",
        "priceRange": "$$",
        "founder": [
          { "@type": "Person", "name": "Alex Keeting" },
          { "@type": "Person", "name": "Parker Katamura" }
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Lee's Summit",
          "addressRegion": "MO",
          "addressCountry": "US"
        },
        "areaServed": { "@type": "Country", "name": "United States" },
        "sameAs": ["https://www.instagram.com/apadigitalmarketinggroup/"],
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Social Media Management" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Paid Advertising Strategy" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Lead Generation Campaigns" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Customer Acquisition & Sales Growth" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website & Landing Page Support" } }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
